<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#273449" stroke-width="0.75" opacity="0.3"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Geometric accent circles -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.25"/>
  <circle cx="200" cy="180" r="95" fill="none" stroke="#67E8F9" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Stylized avatar silhouette / developer icon -->
  <!-- Head -->
  <circle cx="200" cy="160" r="60" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  
  <!-- Face/Initials Monogram -->
  <text x="200" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="url(#cyanBlue)" text-anchor="middle" letter-spacing="2">EFA</text>

  <!-- Shoulders & Torso -->
  <path d="M 105 340 C 110 260, 150 245, 200 245 C 250 245, 290 260, 295 340 Z" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>

  <!-- Code/Tech Accent lines -->
  <line x1="80" y1="380" x2="320" y2="380" stroke="#273449" stroke-width="1"/>
  <line x1="120" y1="400" x2="280" y2="400" stroke="#273449" stroke-width="1" stroke-dasharray="4,4"/>
  
  <text x="200" y="440" font-family="monospace" font-size="14" fill="#9AA9BC" text-anchor="middle" letter-spacing="3">&lt;DEVELOPER /&gt;</text>
  <text x="200" y="465" font-family="sans-serif" font-size="12" fill="#67E8F9" text-anchor="middle" opacity="0.8">Edra Fahar Athaya</text>
</svg>
