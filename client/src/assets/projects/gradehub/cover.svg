<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="gradeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradeGrad)"/>
  
  <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#273449" stroke-width="0.8" opacity="0.3"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>

  <!-- GradeHub Window Graphic -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="#111827" stroke="#273449" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="60" y="45" width="680" height="44" rx="12" fill="#172033"/>
  <circle cx="85" cy="67" r="6" fill="#EF4444"/>
  <circle cx="105" cy="67" r="6" fill="#F59E0B"/>
  <circle cx="125" cy="67" r="6" fill="#10B981"/>
  <text x="160" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E8EEF7">GradeHub — School Academic &amp; Grade Management (MVC)</text>

  <!-- Sidebar -->
  <rect x="60" y="89" width="160" height="316" fill="#0E1626"/>
  <rect x="75" y="110" width="130" height="28" rx="6" fill="#1E293B"/>
  <text x="90" y="128" font-family="sans-serif" font-size="11" fill="#60A5FA">Dashboard</text>
  <text x="90" y="160" font-family="sans-serif" font-size="11" fill="#9AA9BC">Student Records</text>
  <text x="90" y="190" font-family="sans-serif" font-size="11" fill="#9AA9BC">Courses &amp; Classes</text>
  <text x="90" y="220" font-family="sans-serif" font-size="11" fill="#9AA9BC">Grades &amp; GPA</text>
  <text x="90" y="250" font-family="sans-serif" font-size="11" fill="#9AA9BC">Role Permissions</text>

  <!-- Main Content Area -->
  <!-- Stats row -->
  <rect x="240" y="110" width="140" height="60" rx="8" fill="#172033" stroke="#273449"/>
  <text x="255" y="132" font-family="sans-serif" font-size="10" fill="#9AA9BC">ROLES</text>
  <text x="255" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#E8EEF7">Admin / Teach / Stud</text>

  <rect x="400" y="110" width="140" height="60" rx="8" fill="#172033" stroke="#273449"/>
  <text x="415" y="132" font-family="sans-serif" font-size="10" fill="#9AA9BC">ARCHITECTURE</text>
  <text x="415" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#60A5FA">MVC Pattern</text>

  <rect x="560" y="110" width="160" height="60" rx="8" fill="#172033" stroke="#273449"/>
  <text x="575" y="132" font-family="sans-serif" font-size="10" fill="#9AA9BC">DATABASE</text>
  <text x="575" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#10B981">PostgreSQL / Supabase</text>

  <!-- Table Preview -->
  <rect x="240" y="190" width="480" height="190" rx="8" fill="#172033" stroke="#273449"/>
  <rect x="240" y="190" width="480" height="32" rx="8" fill="#1E293B"/>
  <text x="260" y="211" font-family="sans-serif" font-size="11" font-weight="600" fill="#9AA9BC">Student ID</text>
  <text x="350" y="211" font-family="sans-serif" font-size="11" font-weight="600" fill="#9AA9BC">Course</text>
  <text x="490" y="211" font-family="sans-serif" font-size="11" font-weight="600" fill="#9AA9BC">Assignment</text>
  <text x="600" y="211" font-family="sans-serif" font-size="11" font-weight="600" fill="#9AA9BC">Final Grade</text>

  <!-- Row 1 -->
  <line x1="240" y1="255" x2="720" y2="255" stroke="#273449" stroke-width="1"/>
  <text x="260" y="244" font-family="monospace" font-size="11" fill="#E8EEF7">STD-2024-01</text>
  <text x="350" y="244" font-family="sans-serif" font-size="11" fill="#E8EEF7">Software Eng</text>
  <text x="490" y="244" font-family="sans-serif" font-size="11" fill="#67E8F9">94 / 100</text>
  <text x="600" y="244" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">A (4.00)</text>

  <!-- Row 2 -->
  <line x1="240" y1="290" x2="720" y2="290" stroke="#273449" stroke-width="1"/>
  <text x="260" y="279" font-family="monospace" font-size="11" fill="#E8EEF7">STD-2024-02</text>
  <text x="350" y="279" font-family="sans-serif" font-size="11" fill="#E8EEF7">Web Development</text>
  <text x="490" y="279" font-family="sans-serif" font-size="11" fill="#67E8F9">89 / 100</text>
  <text x="600" y="279" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">A- (3.75)</text>

  <!-- Row 3 -->
  <line x1="240" y1="325" x2="720" y2="325" stroke="#273449" stroke-width="1"/>
  <text x="260" y="314" font-family="monospace" font-size="11" fill="#E8EEF7">STD-2024-03</text>
  <text x="350" y="314" font-family="sans-serif" font-size="11" fill="#E8EEF7">Database Systems</text>
  <text x="490" y="314" font-family="sans-serif" font-size="11" fill="#67E8F9">91 / 100</text>
  <text x="600" y="314" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">A (4.00)</text>
</svg>
