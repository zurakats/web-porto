<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#leadGrad)"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.3"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Banking Sales / Lead Scoring UI Dashboard Wireframe Graphic -->
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#111827" stroke="#273449" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="60" y="50" width="680" height="44" rx="12" fill="#1E293B"/>
  <circle cx="85" cy="72" r="6" fill="#EF4444"/>
  <circle cx="105" cy="72" r="6" fill="#F59E0B"/>
  <circle cx="125" cy="72" r="6" fill="#10B981"/>
  <text x="160" y="77" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E8EEF7">Predictive Lead Scoring Portal — Banking Sales Analytics</text>

  <!-- Metric Badges -->
  <rect x="90" y="115" width="180" height="70" rx="8" fill="#172033" stroke="#273449"/>
  <text x="105" y="140" font-family="sans-serif" font-size="11" fill="#9AA9BC">HIGH POTENTIAL LEADS</text>
  <text x="105" y="170" font-family="sans-serif" font-size="22" font-weight="700" fill="#67E8F9">84.6% Match</text>

  <rect x="290" y="115" width="180" height="70" rx="8" fill="#172033" stroke="#273449"/>
  <text x="305" y="140" font-family="sans-serif" font-size="11" fill="#9AA9BC">SCORING ENGINE STATUS</text>
  <text x="305" y="170" font-family="sans-serif" font-size="16" font-weight="600" fill="#10B981">Active (ML API)</text>

  <rect x="490" y="115" width="220" height="70" rx="8" fill="#172033" stroke="#273449"/>
  <text x="505" y="140" font-family="sans-serif" font-size="11" fill="#9AA9BC">CAPSTONE ROLE</text>
  <text x="505" y="170" font-family="sans-serif" font-size="15" font-weight="600" fill="#60A5FA">React &amp; Backend (REBE)</text>

  <!-- Chart Visualization -->
  <rect x="90" y="205" width="620" height="170" rx="8" fill="#172033" stroke="#273449"/>
  <line x1="120" y1="340" x2="680" y2="340" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="280" x2="680" y2="280" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="230" x2="680" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bars -->
  <rect x="150" y="270" width="35" height="70" rx="4" fill="url(#barGrad)"/>
  <rect x="220" y="240" width="35" height="100" rx="4" fill="url(#barGrad)"/>
  <rect x="290" y="290" width="35" height="50" rx="4" fill="url(#barGrad)"/>
  <rect x="360" y="220" width="35" height="120" rx="4" fill="url(#barGrad)"/>
  <rect x="430" y="250" width="35" height="90" rx="4" fill="url(#barGrad)"/>
  <rect x="500" y="210" width="35" height="130" rx="4" fill="url(#barGrad)"/>
  <rect x="570" y="235" width="35" height="105" rx="4" fill="url(#barGrad)"/>
  <rect x="640" y="260" width="35" height="80" rx="4" fill="url(#barGrad)"/>
</svg>
